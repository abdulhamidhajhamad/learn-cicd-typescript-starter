name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: qwiklabs-gcp-04-b94f66f44bbb

      - name: Build and Push Docker Image
        run: |
          gcloud builds submit --tag us-west1-docker.pkg.dev/qwiklabs-gcp-04-b94f66f44bbb/notely-ar-repo/notely:latest .

      - name: Run Migrations
        run: npm run db:migrate

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely --image us-west1-docker.pkg.dev/qwiklabs-gcp-04-b94f66f44bbb/notely-ar-repo/notely:latest --region us-west1 --allow-unauthenticated --project qwiklabs-gcp-04-b94f66f44bbb --max-instances=4